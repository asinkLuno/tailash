[package]
name = "tailash"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
gpui-kit = "0.10.0"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
anyhow = "1"

libc = "0.2"
[dev-dependencies]
gpui-kit = { version = "0.10.0", features = ["test-support"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
opt-level = "s"
