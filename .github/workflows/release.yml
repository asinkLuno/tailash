name: Release

# 从 main merge 到 releases 分支并 push 时触发构建发布
on:
  push:
    branches:
      - releases
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'yarn'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'tailash v__VERSION__'
          releaseBody: '请前往 Assets 下载对应平台的安装包。Arch Linux 用户可下载 .pkg.tar.zst 后执行 sudo pacman -U 安装。'
          releaseDraft: true
          prerelease: false

      # Tauri CLI 尚不支持直接产出 .pkg.tar.zst（上游 pacman 目标只生成 AUR 的 tar.gz），
      # 因此从 deb 中提取产物，在 archlinux 容器内用 makepkg 打出 Arch 二进制包并上传。
      - name: Build and upload Arch Linux package (.pkg.tar.zst)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          DEB=$(ls src-tauri/target/release/bundle/deb/*.deb | head -n1)
          PKGNAME=$(dpkg-deb -f "$DEB" Package)
          PKGVER=${VERSION%%-*}
          PKGDESC=$(dpkg-deb -f "$DEB" Description | head -n1)

          mkdir -p arch-pkg/payload
          dpkg-deb -x "$DEB" arch-pkg/payload
          cat > arch-pkg/PKGBUILD <<EOF
          pkgname=$PKGNAME
          pkgver=$PKGVER
          pkgrel=1
          pkgdesc="$PKGDESC"
          url="https://github.com/${GITHUB_REPOSITORY}"
          arch=('x86_64')
          license=('custom')
          depends=('webkit2gtk-4.1' 'gtk3')
          PKGEXT='.pkg.tar.zst'

          package() {
            cp -a "\$startdir/payload/." "\$pkgdir/"
          }
          EOF

          docker run --rm -v "$PWD/arch-pkg:/work" archlinux:base-devel bash -euc '
            useradd -m builder
            chown -R builder:builder /work
            su builder -c "cd /work && makepkg -f --nodeps"
          '

          gh release upload "v$VERSION" arch-pkg/*.pkg.tar.zst --clobber
